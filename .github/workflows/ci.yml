name: CI

# Runs on every PR and every push to master. build.yml only fires on version
# tags, so without this nothing validates a contribution until a release is
# already being cut.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ci, not install: install may resolve past the lockfile, so what CI
      # verifies would no longer be what the lockfile reproduces.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Covers src/, vite.config.ts, AND electron/ — the main process was
      # outside every tsconfig include until tsconfig.electron.json was added.
      - name: Type-check
        run: npx tsc -b

      - name: Test
        run: npm test

      # Renderer + main + preload bundles. Packaging installers is left to
      # build.yml; this only needs to prove the code compiles and bundles.
      - name: Build
        run: npx vite build
