name: CI/CD Build Pipeline

on:
  push:
    tags:
      - 'v*' # This triggers the workflow ONLY when you push a tag like "v1.0.0"

permissions:
  contents: write

jobs:
  # Runs once, before the OS matrix, so exactly one draft release object
  # exists for this tag. Without this, both matrix jobs independently ask
  # "does a release for this tag exist yet?" via electron-builder's publish
  # step at roughly the same moment, both get "no", and both create their
  # own draft — leaving a stray duplicate release that has to be cleaned up
  # by hand later. Idempotent so re-running a failed workflow on the same
  # tag doesn't error out on an already-existing release.
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if it doesn't already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — reusing it."
          else
            gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes --repo "${{ github.repository }}"
          fi

  build:
    name: Build & Publish on ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Build simultaneously on Windows and macOS virtual machines
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # package.json's version is otherwise just whatever a developer last
      # typed by hand — nothing enforced it matched the tag actually being
      # released. This makes the pushed tag the single source of truth:
      # electron-builder reads {version} from package.json for artifact
      # names, the release output directory, and the update manifest, so
      # this has to happen before the build step, not after.
      - name: Sync package.json version with the pushed tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' doesn't look like a version tag (expected vX.Y.Z) — aborting." >&2
            exit 1
          fi
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      # electron-builder publishes the installers AND the latest.yml /
      # latest-mac.yml / .blockmap files electron-updater needs to detect
      # updates. Uploading only the .exe/.dmg (as before) meant the
      # auto-updater could never actually find a new version.
      # GH_TOKEN publishes to a draft release; both OS jobs append to the
      # same draft for this tag, then the publish-release job below makes
      # it public once both platforms have finished.
      # CSC_LINK / CSC_KEY_PASSWORD are optional: electron-builder auto-signs
      # if they're set and silently skips signing if they're not (unsigned
      # builds still work, they just trigger SmartScreen/Gatekeeper warnings).
      # To sign builds later: buy a code-signing cert, base64-encode the
      # .pfx (Windows) / .p12 (macOS), and add CSC_LINK + CSC_KEY_PASSWORD
      # as repo secrets — no workflow changes needed after that.
      # electron-builder checks CSC_LINK with `!= null`, not truthiness — if the
      # repo secret doesn't exist, `${{ secrets.CSC_LINK }}` evaluates to an
      # empty string (not undefined), which electron-builder reads as "yes,
      # sign with this", tries to resolve it as a certificate path, and fails
      # ("<repo root> not a file"). Only forward the vars when the secret is
      # genuinely set, so an unconfigured signing cert means "skip signing"
      # (the intended/documented behavior) instead of a hard build failure.
      - name: Resolve optional code-signing secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build & Publish to GitHub Releases (draft)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Once both Windows and Mac builds have uploaded their assets to the
  # draft release, publish it. Publishing is what makes electron-updater
  # (running in every installed copy of the app) see the new version and
  # show the "Update Available" notification to users.
  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Un-draft the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
